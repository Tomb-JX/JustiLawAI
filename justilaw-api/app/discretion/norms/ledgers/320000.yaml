items:
- path: 前言.1
  text: 江苏省公安厅关于印发《赌博违法案件裁量指导意见》的通知（苏公规〔2019〕1号）
  disposition: context
- path: 前言.2
  text: 各市、县公安局，城市公安分局：为遏制赌博违法活动发展蔓延，厘清群众棋牌娱乐与赌博违法行为的界限，进一步完善赌博违法案件裁量标准，保障法律正确实施，积极回应社会关切，省厅制定了《赌博违法案件裁量指导意见》，现印发给你们，请结合实际认真贯彻执行。执行中遇到的问题，请及时报告省厅。
  disposition: context
- path: 前言.3
  text: 江苏省公安厅2019年2月2日
  disposition: context
- path: 前言.4
  text: 为规范公安机关治安管理处罚赌博违法案件自由裁量权，确保执法公平公正，根据《中华人民共和国治安管理处罚法》《中华人民共和国行政处罚法》《公安机关办理行政案件程序规定》等，结合执法实践，制定本指导意见。
  disposition: context
- path: 一
  text: 一、赌资的认定及处理
  disposition: context
- path: 一.（一）
  text: （一）下列财物应当认定为赌资：
  disposition: element
  refs:
  - field:amounts.personal_stake
  - field:amounts.cumulative_stake
  note: 赌资认定范围的总述，由赌资字段定义承接
- path: 一.（一）.1
  text: 1．赌博活动中用作赌注的款物；
  disposition: element
  refs:
  - field:amounts.personal_stake
  note: schema 定义：本人用作赌注的款物
- path: 一.（一）.2
  text: 2．赌博活动中换取筹码的款物；
  disposition: element
  refs:
  - field:amounts.personal_stake
  note: schema 定义：换取筹码的款物
- path: 一.（一）.3
  text: 3．通过赌博赢取的款物；
  disposition: element
  refs:
  - field:amounts.personal_stake
  note: schema 定义：赢取的款物
- path: 一.（一）.4
  text: 4．在利用计算机网络或组织他人赴境外进行的赌博活动中，分赌场、下级庄家或者赌博参与者在组织或者参与赌博前向赌博组织者、上级庄家或者赌博公司交付的押金；
  disposition: gap
  refs:
  - field:amounts.cumulative_stake
  note: 网络 / 境外赌博中交付的押金计入赌资：字段定义与标注指南未写明（Q-21）
- path: 一.（一）.5
  text: 5．在赌博活动中放贷的款物。
  disposition: gap
  refs:
  - field:amounts.personal_stake
  note: 赌博中放贷的款物计入赌资：字段定义与标注指南未写明（Q-21）
- path: 一.（二）
  text: （二）赌博现场没有赌资，而是以筹码、电子钱包移动支付或者事先约定事后交割等方式代替的，赌资数额经调查属实后予以认定。
  disposition: element
  refs:
  - field:amounts.personal_stake
  - field:amounts.cumulative_stake
  note: 筹码、电子支付、事后交割经查实的数额计入赌资；工单 C BRIEF 已写入口径，标注指南待同步（Q-21）
- path: 一.（三）
  text: （三）每次赌博查实的赌资应当累计计算。
  disposition: encoded
  refs:
  - rules.参与赌博.measures.personal_or_per_capita
  - field:amounts.cumulative_stake
  note: 10-28 补编：累计赌资优先作为定档赌资（C-44）
- path: 一.（四）
  text: （四）个人赌资能够查实的，优先适用个人查实赌资量罚；个人赌资无法确定时，按照参赌款物的价值总额除以参赌人数得出的人均赌资量罚。
  disposition: encoded
  refs:
  - rules.参与赌博.measures.personal_or_per_capita
  note: 个人查实优先、否则人均（per_capita）
- path: 一.（五）
  text: （五）通过计算机网络、赌博机实施赌博活动的赌资数额，可以按照在计算机网络、赌博机上投注或者赢取的总点数乘以每个点数实际代表的金额认定。
  disposition: encoded
  refs:
  - rules.参与赌博.measures.personal_or_per_capita
  - field:amounts.cumulative_stake
  note: 网络、赌博机按投注总额认定，标注口径记入累计赌资，按一.（三）同一取值顺序定档
- path: 一.（六）
  text: （六）对查获的赌资应当收缴。对现场查获的赌资无法分清所有人的，可以作为参赌人员的共同赌资予以收缴。对现场查获参赌人员随身携带的财物，根据赌博方式、赌注大小、参赌时间等案件调查情况，查明属于赌资的，应当予以收缴。对参加计算机网络赌博的，按照查实的结算后实有赌资予以收缴。
  disposition: not_applicable
  note: 赌资收缴，属处置措施，不影响处罚种类与档位
- path: 二
  text: 二、对赌博活动中的交通、通讯工具的处理对参与赌博人员使用的交通、通讯工具用作赌注的，应当收缴。
  disposition: not_applicable
  note: 交通、通讯工具收缴，属处置措施
- path: 二.段2
  text: 在以营利为目的，聚众赌博、开设赌场，或者发行、销售“六合彩”等其他私彩为赌博提供条件，尚不够刑事处罚的案件中，违法行为人本人所有的用于纠集、联络、运送参赌人员以及用于望风护赌的交通、通讯工具，应当认定为作案工具依法予以收缴。
  disposition: not_applicable
  note: 作案工具收缴，属处置措施
- path: 三
  text: 三、对赌博行为治安处罚的裁量标准对赌博行为作出治安处罚，应当坚持公平公正、同等情况同等对待，依据赌博方式、赌资数额，并结合其他情节确定处罚幅度。
  disposition: context
