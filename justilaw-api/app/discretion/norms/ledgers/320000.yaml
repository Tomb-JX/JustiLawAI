  note: 兜底条款"其他依法应当从重处罚的情形"
- path: 五.（二）
  text: （二）有下列情形之一的，从轻、减轻或者免予处罚：
  disposition: context
- path: 五.（二）.1
  text: 1．未成年人参与赌博或者为赌博提供条件的；
  disposition: encoded
  refs:
  - code:norm_layer._not_executed
  - field:person.age
  note: 未成年人从轻减轻由国家法年龄规则覆盖
- path: 五.（二）.2
  text: 2．被胁迫、诱骗参与赌博或者为赌博提供条件的；
  disposition: encoded
  refs:
  - code:norm_layer._active
  - field:circumstances.coerced_or_lured
  note: 国家法"出于他人胁迫或者诱骗"
- path: 五.（二）.3
  text: 3．主动投案，向公安机关如实陈述赌博或者为赌博提供条件的违法行为的；
  disposition: encoded
  refs:
  - code:norm_layer._active
  - field:circumstances.surrendered
  - field:circumstances.truthful_statement
  note: 国家法"主动投案如实陈述"
- path: 五.（二）.4
  text: 4．自愿认错认罚，协助查禁赌博活动，有立功表现的；
  disposition: encoded
  refs:
  - code:norm_layer._active
  - field:circumstances.admits_and_accepts
  - field:circumstances.meritorious
  note: 国家法"认错认罚""立功"
- path: 五.（二）.5
  text: 5．检举、揭发他人赌博行为，并经查证属实的；
  disposition: encoded
  refs:
  - code:norm_layer._active
  - field:circumstances.meritorious
  note: 检举揭发经查证属实按立功
- path: 五.（二）.6
  text: 6．其他依法应当从轻、减轻或者不予处罚的情形。
  disposition: manual
  note: 兜底条款"其他依法应当从轻、减轻或者不予处罚的情形"
- path: 六
  text: 六、不以赌博或者为赌博提供条件论处的情形
  disposition: context
- path: 六.（一）
  text: （一）不以营利为目的，家庭成员、亲属之间进行的带有财物输赢的打麻将、玩扑克等活动，不以赌博论处；亲属之外的其他人之间带有少量财物输赢的打麻将、玩扑克等娱乐活动，不予处罚。
  disposition: element
  refs:
  - field:conduct.behavior_type
  note: 亲属间带彩娱乐、少量输赢娱乐不以赌博论处：由行为类型（带彩娱乐等）承接，引擎对非赌博行为不给省级档位
- path: 六.（二）
  text: （二）提供棋牌服务场所只收取正常的场所和服务费用的经营行为，不以为赌博提供条件论处，但明知他人赌博的除外。
  disposition: manual
  refs:
  - field:amounts.commission
  note: 只收正常场所服务费的棋牌经营不论处，但"明知他人赌博"除外：明知的认定由办案人判断（见七.（一））
- path: 六.（三）
  text: （三）在赌博场所从事一般服务、领取固定工资报酬、不从赌博行为中抽取利润的工作人员，不以为赌博提供条件论处。
  disposition: manual
  refs:
  - field:conduct.role
  note: 赌场一般服务人员不论处：须判断是否从赌博中抽取利润
- path: 六.（四）
  text: （四）赌资数额未达到本意见起罚下限标准的，对赌博人员免予处罚，但应当给予批评教育；未成年人有赌博违法行为的，应当责令父母或者其他监护人严加管教。
  disposition: encoded
  refs:
  - rules.参与赌博.below_min
  - rules.参与赌博.below_min_review
  note: 未达起罚下限免予处罚；附赌资口径核实提示（Q-02）
- path: 七
  text: 七、其他规定
  disposition: context
- path: 七.（一）
  text: （一）有下列情形之一的，可以认定为本意见第六条第（二）项规定的“明知”：
  disposition: manual
  note: '"明知"的认定情形，供办案人判断六.（二）'
- path: 七.（一）.1
  text: 1．提供以筹码换现金服务的；
  disposition: manual
  note: 明知认定情形
- path: 七.（一）.2
  text: 2．不收取固定服务费用，按照参赌人数的多少收取费用或者获利金额抽头渔利的；
  disposition: manual
  note: 明知认定情形
- path: 七.（一）.3
  text: 3．参赌人员在桌面公开摆放赌资的；
  disposition: manual
  note: 明知认定情形
- path: 七.（一）.4
  text: 4．场所业主和从业人员组织、招引他人赌博的；
  disposition: manual
  note: 明知认定情形
- path: 七.（一）.5
  text: 5．在执法人员调查时，以向涉赌嫌疑人员通风报信、与涉赌人员串供等方式干扰调查的；
  disposition: manual
  note: 明知认定情形
- path: 七.（一）.6
  text: 6．有其他证据证明行为人系明知的。
  disposition: manual
  note: 明知认定情形
- path: 七.（二）
  text: （二）本意见规定的“以上”、“以下”均含本数。
  disposition: encoded
  refs:
  - code:norm_layer._band_index
  note: '"以上"含本数：x ≥ 下限即达该档'
- path: 七.（三）
  text: （三）可同时供多人使用的赌博机，台数按照能够独立供一人进行赌博活动的操作基本单元的数量认定。
  disposition: gap
  note: 赌博机台数按可独立操作单元计：无赌博机台数字段（见四.（一）.3 等）
- path: 七.（四）
  text: （四）本意见自公布之日起执行，此前省公安厅有关规定与本意见不一致的，以本意见为准。
  disposition: encoded
  refs:
  - documents
  note: 施行日期记于 documents.effective_from，规则按行为、决定日期判断是否生效
