articles:
  "12": "已满十四周岁不满十八周岁的人违反治安管理的，从轻或者减轻处罚；不满十四周岁的人违反治安管理的，不予处罚，但是应当责令其监护人严加管教。"
  "16": "有两种以上违反治安管理行为的，分别决定，合并执行处罚。行政拘留处罚合并执行的，最长不超过二十日。"
  "20": "违反治安管理有下列情形之一的，从轻、减轻或者不予处罚：（一）情节轻微的；（二）主动消除或者减轻违法后果的；（三）取得被侵害人谅解的；（四）出于他人胁迫或者诱骗的；（五）主动投案，向公安机关如实陈述自己的违法行为的；（六）有立功表现的。"
  "21": "违反治安管理行为人自愿向公安机关如实陈述自己的违法行为，承认违法事实，愿意接受处罚的，可以依法从宽处理。"
  "22": "违反治安管理有下列情形之一的，从重处罚：（一）有较严重后果的；（二）教唆、胁迫、诱骗他人违反治安管理的；（三）对报案人、控告人、举报人、证人打击报复的；（四）一年以内曾受过治安管理处罚的。"
  "23": "违反治安管理行为人有下列情形之一，依照本法应当给予行政拘留处罚的，不执行行政拘留处罚：（一）已满十四周岁不满十六周岁的；（二）已满十六周岁不满十八周岁，初次违反治安管理的；（三）七十周岁以上的；（四）怀孕或者哺乳自己不满一周岁婴儿的。前款第一项、第二项、第三项规定的行为人违反治安管理情节严重、影响恶劣的，或者第一项、第三项规定的行为人在一年以内二次以上违反治安管理的，不受前款规定的限制。"
  "82": "以营利为目的，为赌博提供条件的，或者参与赌博赌资较大的，处五日以下拘留或者一千元以下罚款；情节严重的，处十日以上十五日以下拘留，并处一千元以上五千元以下罚款。"
  "144": "本法自2026年1月1日起施行。"

# 第八十二条罚则。combination：或 = 二者择一；并处 = 必须同时处；可以并处 = 拘留必处、罚款可选。
# 罚款下限法条未写明，记为 1 元。
penalty:
  article: "82"
  behaviors:
    为赌博提供条件: 以营利为目的
    参与赌博: 赌资较大
  tiers:
    一般:
      combination: 或
      detention: [1, 5]
      fine: [1, 1000]
    情节严重:
      combination: 并处
      detention: [10, 15]
      fine: [1000, 5000]

