# 中华人民共和国治安管理处罚法（2025 年修订）
# 条文为逐字原文；结构化参数由模型组按原文录入，须经法律组双人核对签字（门禁 G0.1）后改为"已核验"。
law_id: psal-2025
title: 中华人民共和国治安管理处罚法（2025年修订）
