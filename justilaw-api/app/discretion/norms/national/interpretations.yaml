documents:
  - doc_id: gtz-2007-1
    title: 公安机关执行《中华人民共和国治安管理处罚法》有关问题的解释（二）
    number: 公通字〔2007〕1号
    source:
      url: https://www.055110.com/law/1/12804.html
      publisher: 律法网（转载，待对照官方文本）
      retrieved: 2026-10-15
    verification:
      status: 待核验
      note: 依据 2005 年版条文编号（第十二、十四、十九条）制定，在 2025 年修订后是否继续适用须法律组确认
    articles:
      "4": "违反治安管理行为人具有《治安管理处罚法》第十二条、第十四条、第十九条减轻处罚情节的，按下列规定适用：（一）法定处罚种类只有一种，在该法定处罚种类的幅度以下减轻处罚；（二）法定处罚种类只有一种，在该法定处罚种类的幅度以下无法再减轻处罚的，不予处罚；（三）规定拘留并处罚款的，在法定处罚幅度以下单独或者同时减轻拘留和罚款，或者在法定处罚幅度内单处拘留；（四）规定拘留可以并处罚款的，在拘留的法定处罚幅度以下减轻处罚；在拘留的法定处罚幅度以下无法再减轻处罚的，不予处罚。"
      "5": "《治安管理处罚法》第二十一条第二项规定的\"初次违反治安管理\"，是指行为人的违反治安管理行为第一次被公安机关发现或者查处。"

