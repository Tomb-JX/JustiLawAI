documents:
  - doc_id: gtz-2007-1
    title: 公安机关执行《中华人民共和国治安管理处罚法》有关问题的解释（二）
    number: 公通字〔2007〕1号
    source:
      url: https://www.pkulaw.com/chl/91be11e7d9c42ab5bdfb.html
      publisher: 北大法宝（法规库，部门规范性文件，现行有效）；初录自律法网转载
      retrieved: 2026-10-16
    verification:
      status: 待核验
      note: 依据 2005 年版条文编号（第十二、十四、十九、二十一条）制定，在 2025 年修订后是否继续适用须法律组确认
    source_check:
      checked_at: 2026-10-16
      result: 第四项一致（法宝原文另有小标题"关于减轻处罚的适用问题"）；第五项初录时缺后半段五种例外情形，已按法宝原文补全
    headings:
      "4": 关于减轻处罚的适用问题
      "5": 关于"初次违反治安管理"的认定问题
    articles:
      "4": "违反治安管理行为人具有《治安管理处罚法》第十二条、第十四条、第十九条减轻处罚情节的，按下列规定适用：（一）法定处罚种类只有一种，在该法定处罚种类的幅度以下减轻处罚；（二）法定处罚种类只有一种，在该法定处罚种类的幅度以下无法再减轻处罚的，不予处罚；（三）规定拘留并处罚款的，在法定处罚幅度以下单独或者同时减轻拘留和罚款，或者在法定处罚幅度内单处拘留；（四）规定拘留可以并处罚款的，在拘留的法定处罚幅度以下减轻处罚；在拘留的法定处罚幅度以下无法再减轻处罚的，不予处罚。"
      "5": "《治安管理处罚法》第二十一条第二项规定的“初次违反治安管理”，是指行为人的违反治安管理行为第一次被公安机关发现或者查处。但具有下列情形之一的，不属于“初次违反治安管理”：（一）曾违反治安管理，虽未被公安机关发现或者查处，但仍在法定追究时效内的；（二）曾因不满十六周岁违反治安管理，不执行行政拘留的；（三）曾违反治安管理，经公安机关调解结案的；（四）曾被收容教养、劳动教养的；（五）曾因实施扰乱公共秩序，妨害公共安全，侵犯人身权利、财产权利，妨害社会管理的行为被人民法院判处刑罚或者免除刑事处罚的。"

  - doc_id: gtz-2005-30
    title: 公安部关于办理赌博违法案件适用法律若干问题的通知
    number: 公通字〔2005〕30号
    source:
      url: https://www.pkulaw.com/chl/ae6a244e53eb0a6fbdfb.html
      publisher: 北大法宝（法规库，部门规范性文件，现行有效；2005-05-25 发布施行）
      retrieved: 2026-10-16
    verification: {status: 待核验, note: 只取得第六、九项原文；其余各项（含"赌资较大"标准如何确定）未取得}
    source_check:
      checked_at: 2026-10-16
      result: 第六、九项原文取自法宝语义检索（只认文号相符的结果）；按内容检索"赌资较大"标准未命中本通知
    articles:
      "6": "赌博现场没有赌资，而是以筹码或者事先约定事后交割等方式代替的，赌资数额经调查属实后予以认定。个人投注的财物数额无法确定时，按照参赌财物的价值总额除以参赌人数的平均值计算。通过计算机网络实施赌博活动的赌资数额，可以按照在计算机网络上投注或者赢取的总点数乘以每个点数实际代表的金额认定。赌博的次数，可以按照在计算机网络上投注的总次数认定。"
      "9": "不以营利为目的，亲属之间进行带有财物输赢的打麻将、玩扑克等娱乐活动，不予处罚；亲属之外的其他人之间进行带有少量财物输赢的打麻将、玩扑克等娱乐活动，不予处罚。"

  - doc_id: spc-spp-2005-gambling
    title: 最高人民法院、最高人民检察院关于办理赌博刑事案件具体应用法律若干问题的解释
    number: 法释〔2005〕3号
    source:
      url: https://www.pkulaw.com/chl/c59190e7b03c1361bdfb.html
      publisher: 北大法宝（法规库，司法解释，现行有效；2005-05-13 施行）
      retrieved: 2026-10-16
    verification: {status: 待核验, note: 已取得第一、八、九条原文}
    source_check:
      checked_at: 2026-10-16
      result: 第一条所列门槛与 criminal_thresholds 一致；《立案追诉标准（一）》第四十三条为同样的数值
    articles:
      "1": "以营利为目的，有下列情形之一的，属于刑法第三百零三条规定的“聚众赌博”：（一）组织3人以上赌博，抽头渔利数额累计达到5000元以上的；（二）组织3人以上赌博，赌资数额累计达到5万元以上的；（三）组织3人以上赌博，参赌人数累计达到20人以上的；（四）组织中华人民共和国公民10人以上赴境外赌博，从中收取回扣、介绍费的。"
      "8": "赌博犯罪中用作赌注的款物、换取筹码的款物和通过赌博赢取的款物属于赌资。通过计算机网络实施赌博犯罪的，赌资数额可以按照在计算机网络上投注或者赢取的点数乘以每一点实际代表的金额认定。赌资应当依法予以追缴；赌博用具、赌博违法所得以及赌博犯罪分子所有的专门用于赌博的资金、交通工具、通讯工具等，应当依法予以没收。"
      "9": "不以营利为目的，进行带有少量财物输赢的娱乐活动，以及提供棋牌室等娱乐场所只收取正常的场所和服务费用的经营行为等，不以赌博论处。"

# 减轻处罚在合法处罚空间中的展开方式，对应 gtz-2007-1 第四条。
# "或"（拘留或者罚款二选一）不在第四条覆盖范围内：引擎只给出"不予处罚"并标记需人工复核。
mitigation_rules:
  basis: gtz-2007-1#4
  单一种类: 幅度以下减轻；无法再减轻的不予处罚
  并处:
    - {detention: below, fine: within}
    - {detention: within, fine: below}
    - {detention: below, fine: below}
    - {detention: within, fine: none}
  可以并处: 拘留幅度以下减轻；无法再减轻的不予处罚
  或: 未覆盖

