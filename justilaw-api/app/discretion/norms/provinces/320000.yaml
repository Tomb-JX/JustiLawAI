    text: |
      江苏省公安厅关于印发《赌博违法案件裁量指导意见》的通知（苏公规〔2019〕1号）
      各市、县公安局，城市公安分局：为遏制赌博违法活动发展蔓延，厘清群众棋牌娱乐与赌博违法行为的界限，进一步完善赌博违法案件裁量标准，保障法律正确实施，积极回应社会关切，省厅制定了《赌博违法案件裁量指导意见》，现印发给你们，请结合实际认真贯彻执行。执行中遇到的问题，请及时报告省厅。
      江苏省公安厅2019年2月2日
      为规范公安机关治安管理处罚赌博违法案件自由裁量权，确保执法公平公正，根据《中华人民共和国治安管理处罚法》《中华人民共和国行政处罚法》《公安机关办理行政案件程序规定》等，结合执法实践，制定本指导意见。
      一、赌资的认定及处理（一）下列财物应当认定为赌资：1．赌博活动中用作赌注的款物；
      2．赌博活动中换取筹码的款物；
      3．通过赌博赢取的款物；
      4．在利用计算机网络或组织他人赴境外进行的赌博活动中，分赌场、下级庄家或者赌博参与者在组织或者参与赌博前向赌博组织者、上级庄家或者赌博公司交付的押金；
      5．在赌博活动中放贷的款物。
      （二）赌博现场没有赌资，而是以筹码、电子钱包移动支付或者事先约定事后交割等方式代替的，赌资数额经调查属实后予以认定。
      （三）每次赌博查实的赌资应当累计计算。
      （四）个人赌资能够查实的，优先适用个人查实赌资量罚；个人赌资无法确定时，按照参赌款物的价值总额除以参赌人数得出的人均赌资量罚。
      （五）通过计算机网络、赌博机实施赌博活动的赌资数额，可以按照在计算机网络、赌博机上投注或者赢取的总点数乘以每个点数实际代表的金额认定。
      （六）对查获的赌资应当收缴。对现场查获的赌资无法分清所有人的，可以作为参赌人员的共同赌资予以收缴。对现场查获参赌人员随身携带的财物，根据赌博方式、赌注大小、参赌时间等案件调查情况，查明属于赌资的，应当予以收缴。对参加计算机网络赌博的，按照查实的结算后实有赌资予以收缴。
      二、对赌博活动中的交通、通讯工具的处理对参与赌博人员使用的交通、通讯工具用作赌注的，应当收缴。
      在以营利为目的，聚众赌博、开设赌场，或者发行、销售“六合彩”等其他私彩为赌博提供条件，尚不够刑事处罚的案件中，违法行为人本人所有的用于纠集、联络、运送参赌人员以及用于望风护赌的交通、通讯工具，应当认定为作案工具依法予以收缴。
      三、对赌博行为治安处罚的裁量标准对赌博行为作出治安处罚，应当坚持公平公正、同等情况同等对待，依据赌博方式、赌资数额，并结合其他情节确定处罚幅度。
      （一）有下列情形之一的，处500元以下罚款：1．参与聚众赌博、网络赌博、赌博机赌博、赌场赌博、“六合彩”以及其他私彩方式赌博，个人赌资或者人均赌资100元以上、不满500元的；
      2．参与其他赌博活动，个人赌资或者人均赌资500元以上、不满2000元的。
      （二）有下列情形之一的，处5日以下拘留：1．参与聚众赌博、网络赌博、赌博机赌博、赌场赌博、“六合彩”以及其他私彩方式赌博，个人赌资或者人均赌资500元以上、不满1000元的；
      2．参与其他赌博活动，个人赌资或者人均赌资2000元以上、不满5000元的；
      3．一年内因赌博被治安管理处罚后又实施的。
      （三）有下列情形之一的，处10日以上15日以下拘留，并处500元以上3000元以下罚款：1．参与聚众赌博、网络赌博、赌博机赌博、赌场赌博、“六合彩”以及其他私彩方式赌博，个人赌资或者人均赌资1000元以上的；
      2．参与其他赌博活动，个人赌资或者人均赌资5000元以上的；
      3．国家工作人员参与赌博的；
      4．其他情节严重的情形。
      四、对为赌博提供条件行为治安处罚的裁量标准对为赌博提供条件行为作出治安处罚，应当依据行为人非法获利数额、违法次数，并结合其他情节确定处罚幅度。
      （一）有下列情形之一的，处500元以下罚款：1．为赌博提供条件，非法获利累计不满200元的；
      2．为赌博提供条件，累计不满5人次的；
      3．设置赌博机或者为他人提供场所放置赌博机的；
      4．明知是赌博机而提供配件或维保服务不满5台的。
      （二）有下列情形之一的，处5日以下拘留：1．为赌博提供条件，非法获利累计200元以上、不满500元的；
      2．为赌博提供条件2次的；
      3．为赌博提供条件，累计5人次以上、不满10人次的；
      4．一年内因为赌博提供条件被治安管理处罚后又实施的；
      5．设置赌博机或者为他人提供场所放置赌博机2台以上，不满5台的；
      6．明知是赌博机而提供配件或维保服务5台以上，不满10台的。
      （三）有下列情形之一的，处10日以上15日以下拘留，并处500元以上3000元以下罚款：1．为赌博提供条件，非法获利累计500元以上的；
      2．为赌博提供条件3次以上的；
      3．为赌博提供条件，累计10人次以上的；
      4．明知他人赌博而放贷赌资的；
      5．发行、销售“六合彩”等其他私彩的；
      6．明知他人从事赌博活动而向其销售赌博机的；
      7．为未成年人赌博提供条件的；
      8．国家工作人员为赌博提供条件的；
      9．组织、协助他人出境赌博的；
      10．通过计算机信息网络平台为赌博提供条件的；
      11．设置赌博机或者为他人提供场所放置赌博机5台以上，不满10台的；
      12．在中小学校园周边200米范围内设置赌博机的；
      13．明知是赌博机而提供配件或维保服务10台以上的；
      14．为赌场接送参赌人员、望风看场、发牌坐庄、兑换筹码的；
      15．其他情节严重的情形。
      五、从重、从轻、减轻处罚和不予处罚等情节（一）有下列情形之一的，从重处罚：1．因赌博或者为赌博提供条件引发其他治安、刑事案件的；
      2．教唆、胁迫、诱骗他人赌博或者为赌博提供条件的；
      3．对报案人、控告人、举报人、证人打击报复的；
      4．刑事处罚执行完毕三年内，或者在缓刑、假释期间，实施赌博或者为赌博提供条件的；
      5．六个月内曾受过治安管理处罚或者一年内因赌博或者为赌博提供条件违法行为受到两次以上公安行政处罚的；
      6．组织、领导实施赌博或者为赌博提供条件的，或在共同赌博或者为赌博提供条件违法行为中起主要作用的；
      7．在聚众赌博、开设赌场共同犯罪中，未被追究刑事责任的；
      8．其他依法应当从重处罚的情形。
      （二）有下列情形之一的，从轻、减轻或者免予处罚：1．未成年人参与赌博或者为赌博提供条件的；
      2．被胁迫、诱骗参与赌博或者为赌博提供条件的；
      3．主动投案，向公安机关如实陈述赌博或者为赌博提供条件的违法行为的；
      4．自愿认错认罚，协助查禁赌博活动，有立功表现的；
      5．检举、揭发他人赌博行为，并经查证属实的；
      6．其他依法应当从轻、减轻或者不予处罚的情形。
      六、不以赌博或者为赌博提供条件论处的情形（一）不以营利为目的，家庭成员、亲属之间进行的带有财物输赢的打麻将、玩扑克等活动，不以赌博论处；亲属之外的其他人之间带有少量财物输赢的打麻将、玩扑克等娱乐活动，不予处罚。
      （二）提供棋牌服务场所只收取正常的场所和服务费用的经营行为，不以为赌博提供条件论处，但明知他人赌博的除外。
      （三）在赌博场所从事一般服务、领取固定工资报酬、不从赌博行为中抽取利润的工作人员，不以为赌博提供条件论处。
      （四）赌资数额未达到本意见起罚下限标准的，对赌博人员免予处罚，但应当给予批评教育；未成年人有赌博违法行为的，应当责令父母或者其他监护人严加管教。
      七、其他规定（一）有下列情形之一的，可以认定为本意见第六条第（二）项规定的“明知”：1．提供以筹码换现金服务的；
      2．不收取固定服务费用，按照参赌人数的多少收取费用或者获利金额抽头渔利的；
      3．参赌人员在桌面公开摆放赌资的；
      4．场所业主和从业人员组织、招引他人赌博的；
      5．在执法人员调查时，以向涉赌嫌疑人员通风报信、与涉赌人员串供等方式干扰调查的；
      6．有其他证据证明行为人系明知的。
      （二）本意见规定的“以上”、“以下”均含本数。
      （三）可同时供多人使用的赌博机，台数按照能够独立供一人进行赌博活动的操作基本单元的数量认定。
      （四）本意见自公布之日起执行，此前省公安厅有关规定与本意见不一致的，以本意见为准。
# 结构化档次（引擎 2026-10-17 复核后改写；原单值 personal_min: 100 会把"其他赌博活动"300 元错判为达到赌资较大，
# 而原文第六条第（四）项规定未达起罚下限的免予处罚）。数额均逐字取自上方 text 第三、四节；"以上""以下"含本数（第七条第（二）项）。
# lower_bounds 是第一、二、三档的下限：x ≥ 第 k 个下限即至少落入第 k 档；低于第一个下限为"未达起罚标准"。
bands:
  names: [第一档, 第二档, 第三档]
  penalty:                        # 原文处罚标准，按旧法（2012 修正）数额制定
    - 处500元以下罚款
    - 处5日以下拘留
    - 处10日以上15日以下拘留，并处500元以上3000元以下罚款
rules:
  参与赌博:
    measures:
      - field: personal_or_per_capita     # 第一节（四）：个人赌资能查实的优先；查不清时用人均赌资
        categories:
          - id: 聚众网络机器赌场私彩
            label: 参与聚众赌博、网络赌博、赌博机赌博、赌场赌博、“六合彩”以及其他私彩方式赌博
            methods: [网络赌博, 赌博机, 六合彩, 私彩]   # 赌博方式可以直接判为本类
            forms: [聚众赌博, 赌场赌博]                 # 其余方式按 conduct.gambling_form 归类（schema 1.2.0）
            lower_bounds: [100, 500, 1000]
          - id: 其他
            label: 参与其他赌博活动
            forms: [其他]
            lower_bounds: [500, 2000, 5000]
    below_min: 赌资数额未达到本意见起罚下限标准的，对赌博人员免予处罚，但应当给予批评教育（第六条第（四）项）
    elevate:
      - {when: civil_servant, to: 3, text: 国家工作人员参与赌博的}
    floor_hint:
      - {when: prior_within_year, to: 2, text: 一年内因赌博被治安管理处罚后又实施的（须核实前次是否因赌博）}
  为赌博提供条件:
    measures:
      - {field: commission, lower_bounds: [0, 200, 500], label: 非法获利累计}
      - {field: times, lower_bounds: [1, 2, 3], label: 为赌博提供条件次数}
      - {field: cumulative_participants, lower_bounds: [1, 5, 10], label: 累计人次}
    elevate:
      - {when: minors_involved, to: 3, text: 为未成年人赌博提供条件的}
      - {when: civil_servant, to: 3, text: 国家工作人员为赌博提供条件的}
      - {when: method_online, to: 3, text: 通过计算机信息网络平台为赌博提供条件的}
    floor_hint:
      - {when: prior_within_year, to: 2, text: 一年内因为赌博提供条件被治安管理处罚后又实施的（须核实前次事由）}
serious_circumstances:            # 第三节（三）“处 10 日以上 15 日以下拘留”档列举（逐字）
  - 参与聚众赌博、网络赌博、赌博机赌博、赌场赌博、“六合彩”以及其他私彩方式赌博，个人赌资或者人均赌资1000元以上的
  - 参与其他赌博活动，个人赌资或者人均赌资5000元以上的
  - 国家工作人员参与赌博的
  - 其他情节严重的情形
