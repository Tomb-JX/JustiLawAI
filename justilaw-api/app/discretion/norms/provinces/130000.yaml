# 河北省治安管理处罚裁量标准中的赌博部分（目标省，用户 2026-10-17 确认）
# 文件元数据已由北大法宝 MCP 检索核实（2026-10-17，law-keyword get_law_list 标题“河北省公安”、正文“赌资较大”，命中 1 件）。
# 条文原文已录入：第 120/121 条自法宝 Word 原件逐字（与同批页文抓取文本一致，仅空白排版差异）；交付包 $JUSTILAW_DATA_DIR/inbox/pkulaw/2026-10-17-norms/。
# 文号：法宝条目与全文均未列（正文仅提及被修订旧版 冀公治[2014]123号）。
# 数额逐字取自第 121 条：“个人赌资二百元以上”与“一场赌资五百元以上”（整场总额口径）并列。
region: "130000"
name: 河北省
documents:
  - number: null                  # 法宝条目未列文号；全文已核亦无（正文仅提及旧版 冀公治[2014]123号）
    title: 河北省公安厅关于印发《河北省公安机关部分治安管理处罚裁量标准(2021修订版)》的通知
    url: https://www.pkulaw.com/lar/a36431d30f7f53bb4ca787f63704fc5abdfb.html
    issuer: 河北省公安厅
    effectiveness: 地方工作文件
    timeliness: 现行有效            # 法宝 2026-10-17 标注
    effective_from: 2021-11-17
    effective_to: null
    law_basis: psal-2012
    new_law_alignment: 未更新-旧法数额  # 2026-10-27 法宝仍标现行有效且无新版；治安法2025修订第82条(2026-01-01施行)罚款上限升至1000/1000-5000，>=2026 决定的档位映射须旗标待定
    verification: {status: 已核验, method: "法宝MCP文件级(2026-10-27唯一版本现行有效)+Word原件三方逐字比对(27/27句,关键档位句4/4)", checked_by: [宏观指引会话], checked_at: '2026-10-27', record: docs/05-research/2026-10-27-m4-route-full-execution-plan.md#4}
    text: |
      一百二十、为赌博提供条件的行为【法律依据】《中华人民共和国治安管理处罚法》第七十条：以营利为目的，为赌博提供条件的，或者参与赌博赌资较大的，处五日以下拘留或者五百元以下罚款；情节严重的，处十日以上十五日以下拘留，并处五百元以上三千元以下罚款。
      【裁量程度和处罚标准】1.“情节较轻”的违法行为。
      为赌博提供条件累计获利二百元以上五百元以下的。
      【处罚标准】处五百元以下罚款。
      2.“一般情节”的违法行为。
      为赌博提供条件累计获利五百元以上一千元以下的。
      【处罚标准】处五日以下拘留。
      3.“情节较重”的违法行为：⑴为赌博提供条件累计获利1000元以上的。
      ⑵国家工作人员为赌博提供条件的。
      ⑶明知他人实施赌博违法犯罪活动，而为其提供高利贷的。
      ⑷采取不报经国家批准，擅自发行、销售彩票的方式，为赌博提供条件，尚不够刑事处罚的。
      ⑸组织、招引中华人民共和国公民赴境外赌博，从中收取回扣、介绍费的。
      ⑹以营利为目的，在公共场所或者公共交通工具上为赌博提供条件的。
      【处罚标准】处十日以上十五日以下拘留，并处五百元以上三千元以下罚款。
      一百二十一、赌博的行为【法律依据】《中华人民共和国治安管理处罚法》第七十条：以营利为目的，为赌博提供条件的，或者参与赌博赌资较大的，处五日以下拘留或者五百元以下罚款；情节严重的，处十日以上十五日以下拘留，并处五百元以上三千元以下罚款。
      【裁量程度和处罚标准】1.“情节较轻”的违法行为。
      一场赌资五百元以上一千元以下或者个人赌资二百元以上五百元以下。
      【处罚标准】处五百元以下罚款。
      2.“一般情节”的违法行为。
      一场赌资一千元以上二千元以下或者个人赌资五百元以上一千元以下的。
      【处罚标准】处五日以下拘留。
      3.“情节较重”的违法行为：⑴一场赌资二千元元以上或者个人赌资一千元以上的。
      ⑵国家工作人员参与赌博的。
      ⑶诱骗、教唆未成年人赌博的。
      ⑷在工作场所、公共场所或者公共交通工具上赌博的。
      ⑸利用互联网、移动终端设备等投注赌博的。
      【处罚标准】处十日以上十五日以下拘留，并处五百元以上三千元以下罚款。
# 结构化档次（引擎 2026-10-17 复核后改写）：第 121 条"一场赌资……或者个人赌资……"是"或"的关系，取两者中较高的档；
# 原单值 personal_min: 200 漏掉了"一场赌资 500 元起"这一并列条件。"一场赌资"指整场赌博的赌资总额，
# 要素里最接近的是 amounts.onsite_stake_total（现场查获的赌资合计），以它近似，结果附注说明。
# 第 120、121 条第 1 档的上限与第 2 档的下限都写"以上……以下"，边界值按"以上"归入较高档（与江苏第七条第（二）项"含本数"同向处理，待法律组确认）。
bands:
  names: [情节较轻, 一般情节, 情节较重]
  penalty:                        # 原文【处罚标准】，按旧法（2012 修正）数额制定
    - 处五百元以下罚款
    - 处五日以下拘留
    - 处十日以上十五日以下拘留，并处五百元以上三千元以下罚款
rules:
  参与赌博:
    measures:
      - {field: personal_stake, lower_bounds: [200, 500, 1000], label: 个人赌资}
      - {field: onsite_stake_total, lower_bounds: [500, 1000, 2000], label: 一场赌资（以现场查获赌资合计近似）}
    below_min: null               # 河北未规定未达起罚标准的处理，按"赌资较大"未达到
    elevate:
      - {when: civil_servant, to: 3, text: 国家工作人员参与赌博的}
      - {when: venue_public, to: 3, text: 在工作场所、公共场所或者公共交通工具上赌博的}
      - {when: method_online, to: 3, text: 利用互联网、移动终端设备等投注赌博的}
  为赌博提供条件:
    measures:
      - {field: commission, lower_bounds: [200, 500, 1000], label: 为赌博提供条件累计获利}
    elevate:
      - {when: civil_servant, to: 3, text: 国家工作人员为赌博提供条件的}
      - {when: venue_public_for_profit, to: 3, text: 以营利为目的，在公共场所或者公共交通工具上为赌博提供条件的}
serious_circumstances:            # 第 121 条“情节较重”档列举（逐字；第 120 条对应列举见 text）
  - 一场赌资二千元元以上或者个人赌资一千元以上的        # 源文疑笔误“二千元元以上”，照录
  - 国家工作人员参与赌博的
  - 诱骗、教唆未成年人赌博的
  - 在工作场所、公共场所或者公共交通工具上赌博的
  - 利用互联网、移动终端设备等投注赌博的
