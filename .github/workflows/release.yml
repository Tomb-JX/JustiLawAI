# 发布单机版：推送 v* 标签（如 v0.1.0）后自动构建前端、打包，并创建 GitHub Release 上传安装包。
# 也可在 Actions 页手动运行（只构建并上传为构建产物，不创建 Release）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: justilaw-web/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建并打包
        run: python ops/package_local.py --version "${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JustiLawAI-local
          path: release/JustiLawAI-local-*

      - name: 创建 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/JustiLawAI-local-*.zip
            release/JustiLawAI-local-*.zip.sha256
          generate_release_notes: true
          body: |
            ## JustiLawAI 单机版

            在自己电脑上运行完整的 JustiLawAI，免登录，数据只保存在本机，模型由本机 Ollama 提供。

            1. 安装并打开 [Ollama](https://ollama.com/download)
            2. 下载下面的 `JustiLawAI-local-${{ github.ref_name }}.zip` 并解压
            3. Windows 双击 `Start-JustiLaw.bat`；macOS / Linux 在终端运行 `bash launcher/start.sh`（macOS 也可右键 `start.command` → 打开）
            4. 浏览器自动打开 http://127.0.0.1:8000 ，按页面上的向导下载模型

            首次启动会自动准备 Python 环境（约 1-3 分钟）。详见包内 README.md。
