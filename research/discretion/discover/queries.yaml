# 发现层查询模板（设计 docs/04-plan/search-discovery-design.md §3.1–3.2）
# 每个模板 = 一组固定检索词；规划器在其上按「区域 → 时间 → 特征词」逐级拆分（结果顶到 top_k 才拆）。
# 改模板会改变 query_id 与缓存键：已有缓存不会被误用，但也不再命中——改前想清楚。

version: 1

api:
  top_k: 50              # 网页结果上限（官方文档：最大 50）
  site_suffix: gov.cn    # 行内 site:，M0 T2 验证支持后缀

templates:
  - id: fy70
    note: 复议决定书 × 旧法第七十条（M0 T2 同款检索式）
    terms: [行政复议决定书, 赌博, 治安管理处罚法第七十条]
  - id: cf70
    note: 公安处罚决定书 × 旧法
    terms: [行政处罚决定书, 赌博, 第七十条]
  - id: wh70
    note: 处罚决定文号写法（行罚决字）× 旧法
    terms: [行罚决字, 赌博, 第七十条]
  - id: cf82
    note: 新法第八十二条，近一年（M0 T8 同款，T-time 主力）
    terms: [赌博, 行政处罚决定书, 第八十二条]
    recency: year
  - id: fy82
    note: 新法第八十二条的复议
    terms: [行政复议决定书, 赌博, 第八十二条]
    recency: year
  - id: zfgs
    note: 执法公示 / 执法结果信息栏目
    terms: [行政执法公示, 赌博, 行政拘留]
  - id: bycf
    note: 不予处罚（门禁 G3.2 单独达标）
    terms: [不予行政处罚决定书, 赌博]
  - id: zjh
    note: 玩法词只能配短检索式（M1：叠在三词模板上返回 0 条，单配文书类型 18 条）
    terms: [行政处罚决定书, 炸金花]
  # 定向扩面模板（targeted: true 不进常规种子，只配 targets 里的地级市名使用；设计 §2.5）
  - id: tc
    note: 地级市 × 公安处罚决定书（非复议来源）
    terms: [行政处罚决定书, 赌博]
    targeted: true
  - id: tf
    note: 地级市 × 复议决定书
    terms: [行政复议决定书, 赌博]
    targeted: true
  # 要素导向模板（2026-10-17，data-requirements.md 对策一正式口径）：
  # 抽头批实测（22 份）事实段含抽头/台费类 75%（常规词批 1–3%），证明要素出现率低是"词没选中要素"。
  # 每批交付后用 research/eval/key_field_presence.py 验收对应要素出现率
  - id: ct
    note: 要素=营利目的/抽头渔利（抽头、台费、抽成词族的主模板）
    terms: [行政处罚决定书, 抽头]
    targeted: true
  - id: xds
    note: 要素=个人赌资（决定书原句"携带赌资X元"）
    terms: [行政处罚决定书, 携带赌资]
    targeted: true
  - id: csry
    note: 要素=参赌人数（聚众型案件写"参赌人员/余人"）
    terms: [行政处罚决定书, 参赌人员]
    targeted: true
  - id: wfjs
    note: 要素=角色（望风/召集型案件）
    terms: [行政处罚决定书, 望风]
    targeted: true
  - id: qk
    note: 要素=前科日期（"曾因赌博被行政拘留"原句）
    terms: [行政处罚决定书, 曾因赌博]
    targeted: true
  # 逐站精扫模板（sweep: true 的模板不进常规种子，只配 site:<县级主域名> 使用；M0 T9：定兴 50/50 含赌）
  - id: sw
    note: 逐站精扫，单词检索覆盖面最大
    terms: [赌博]
    sweep: true

# 拆分维度（设计 §3.2 第一段）
split:
  # 逐级使用的顺序。M1 实测：省名写进检索式是文本匹配，县级文书正文常不写省名（河南复议只回 5 条，
  # 而淇县/卢氏/浚县均有），召回差、对执法公示模板精度也差（浙江 0/50）；所以特征词优先、省名最后
  order: [features, windows, regions]
  regions: [北京, 天津, 河北, 山西, 内蒙古, 辽宁, 吉林, 黑龙江, 上海, 江苏, 浙江, 安徽, 福建, 江西, 山东,
            河南, 湖北, 湖南, 广东, 广西, 海南, 重庆, 四川, 贵州, 云南, 西藏, 陕西, 甘肃, 青海, 宁夏, 新疆]
  # page_time 日期表达式（M0 T7 验证；绝对日期会报错）。带 recency 的模板不做时间拆分
  windows:
    y0-1: {gte: now-1y/d, lte: now/d}
    y1-2: {gte: now-2y/d, lte: now-1y/d}
    y2-3: {gte: now-3y/d, lte: now-2y/d}
    y3-5: {gte: now-5y/d, lte: now-3y/d}
  # 只留 M1 实测有效的特征词（2026-10-15，fy70/cf70 各拆一层）：麻将、网络赌博、为赌博提供条件 均顶到 50 条，
  # 抽头渔利 5/16 条；扑克、炸金花、推饼、六合彩 叠在模板词上一律 0 条——疑似搜索端对「赌博+六合彩/扑克」
  # 一类组合做了风控压制（「行政处罚决定书 赌博 扑克」1 条、「行政复议决定书 赌博 六合彩」0 条）。
  # 炸金花只在短检索式里有结果（「行政处罚决定书 炸金花」18 条），单独做成模板 zjh
  features: [麻将, 网络赌博, 为赌博提供条件, 抽头渔利]

# 目标省（数据收集计划 §2：候选六省市，均有赌博裁量基准）→ 地级行政区全称。
# 定向扩面用地级市名替代省名分片：县级文书正文常不写省名，但常写"××市公安局××分局"（M1 实测省名召回差）。
# 用全称而非简称：简称会误中普通词（如"大同"→"大同小异"），全称同时用于省份归属判定（coverage.py）。
targets:
  山西: [太原市, 大同市, 阳泉市, 长治市, 晋城市, 朔州市, 晋中市, 运城市, 忻州市, 临汾市, 吕梁市]
  湖南: [长沙市, 株洲市, 湘潭市, 衡阳市, 邵阳市, 岳阳市, 常德市, 张家界市, 益阳市, 郴州市, 永州市, 怀化市, 娄底市, 湘西州]
  云南: [昆明市, 曲靖市, 玉溪市, 保山市, 昭通市, 丽江市, 普洱市, 临沧市, 楚雄州, 红河州, 文山州, 西双版纳州, 大理州, 德宏州, 怒江州, 迪庆州]
  安徽: [合肥市, 芜湖市, 蚌埠市, 淮南市, 马鞍山市, 淮北市, 铜陵市, 安庆市, 黄山市, 滁州市, 阜阳市, 宿州市, 六安市, 亳州市, 池州市, 宣城市]
  浙江: [杭州市, 宁波市, 温州市, 嘉兴市, 湖州市, 绍兴市, 金华市, 衢州市, 舟山市, 台州市, 丽水市]
  上海: [黄浦区, 徐汇区, 长宁区, 静安区, 普陀区, 虹口区, 杨浦区, 闵行区, 宝山区, 嘉定区, 浦东新区, 金山区, 松江区, 青浦区, 奉贤区, 崇明区]
  河北: [石家庄市, 唐山市, 秦皇岛市, 邯郸市, 邢台市, 保定市, 张家口市, 承德市, 沧州市, 廊坊市, 衡水市]
  江苏: [南京市, 无锡市, 徐州市, 常州市, 苏州市, 南通市, 连云港市, 淮安市, 盐城市, 扬州市, 镇江市, 泰州市, 宿迁市]
  # 2026-10-20 密度缺口扩展：海南/内蒙古/重庆在网页池有量但 L1≈0 且不在发现覆盖（现有量来自执法公示表页）。
  # 只增 targets 不动模板=不改变已有 query_id/缓存键；全称纪律同 §targets 头部注释。
  海南: [海口市, 三亚市, 儋州市, 琼海市, 文昌市, 万宁市, 东方市, 乐东县, 临高县, 定安县]
  内蒙古: [呼和浩特市, 包头市, 乌海市, 赤峰市, 通辽市, 鄂尔多斯市, 呼伦贝尔市, 巴彦淖尔市, 乌兰察布市, 兴安盟, 锡林郭勒盟, 阿拉善盟]
  重庆: [万州区, 涪陵区, 渝北区, 巴南区, 长寿区, 江津区, 合川区, 永川区, 南川区, 开州区]
