<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>金额关系试标 · 6 案</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202a36;background:#f5f7fa}*{box-sizing:border-box}
body{margin:0}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #cdd7e0;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,input,textarea{font:inherit}button{border:1px solid #9aacbb;border-radius:7px;background:#fff;padding:7px 12px;cursor:pointer}button:hover{background:#edf5fb}button.primary{background:#176399;color:#fff;border-color:#176399}button.primary:hover{background:#104e78}
.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d7e0e7;border-radius:10px;padding:18px;margin:12px 0}h1{font-size:23px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}.hint{color:#546579;font-size:14px}.views{white-space:pre-wrap;line-height:1.9;word-break:break-word}.view{border-left:3px solid #c2d5e3;padding:8px 12px;margin:8px 0;background:#f8fbfd}.label{font-size:12px;color:#567087;margin-bottom:4px}
mark{background:#fff0ae;border-bottom:2px solid #e7ad28;padding:1px 2px}.choice{display:block;border:1px solid #d3dde5;border-radius:8px;padding:9px 12px;margin:7px 0;cursor:pointer}.choice:has(input:checked){border-color:#176399;background:#eaf4fb}.choice input{margin-right:8px}.sub{margin:10px 0 0 27px;padding:10px;border-left:3px solid #8db6d1;background:#f5fafd}.sub label{display:block;margin:5px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.msg{color:#a33513;font-weight:600}.ok{color:#16805d}textarea{width:100%;min-height:65px;border:1px solid #aebdca;border-radius:6px;padding:7px}.progress{font-weight:700;color:#176399}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button.active{background:#dbefff;border-color:#176399}.nav button.done:after{content:' ✓';color:#16805d}.pill{border-radius:20px;background:#e8eef3;padding:3px 9px;font-size:13px}input[type=text]{border:1px solid #9aacbb;border-radius:5px;padding:5px 7px}
</style></head><body><header><strong>金额关系试标</strong><span class="pill">6 案 · 每案 2 题</span><span id="progress" class="progress"></span><span style="flex:1"></span><label>代号 <input id="reviewer" type="text" placeholder="例如 A"></label><button id="export" class="primary">导出标注 JSON</button><label>导入进度 <input id="import" type="file" accept=".json"></label></header>
<main class="wrap"><div id="nav" class="nav"></div><div id="main"></div><div id="message" class="msg"></div></main>
<script>
const CASES=__CASES_JSON__;
const FIELDS=[['personal_stake','个人赌资：目标人个人持有、携带或投入的赌资是哪笔？','actor_relation'],['onsite_stake_total','现场总额：本次现场查获的赌资总额是哪笔？','event_relation']];
const BOUNDARIES={personal_stake:'只选目标人用于下注、换筹码或赢取的款物；台费、场地费属于其他字段。仅有“持有”二字不足以判成个人赌资。',onsite_stake_total:'只选明确作为全体现场赌资合计的金额；个人金额、网络充值/输款、单独的公共赌资不自动等于合计。'};
const KEY='simple-amount-review-v2-'+CASES.map(c=>c.source_sha256).join('').slice(0,80);
const blank=()=>CASES.map(c=>({id:c.id,source_sha256:c.source_sha256,review_status:'pending',answers:Object.fromEntries(FIELDS.map(([f])=>[f,{decision:null,candidate_id:null,relation:null,missed_quote:'',note:''}]))}));
let forms;try{forms=JSON.parse(localStorage.getItem(KEY))||blank()}catch{forms=blank()}
if(!Array.isArray(forms)||forms.length!==CASES.length||forms.some((f,i)=>f.id!==CASES[i].id||f.source_sha256!==CASES[i].source_sha256))forms=blank();
let current=0;const $=id=>document.getElementById(id);
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function save(){localStorage.setItem(KEY,JSON.stringify(forms));$('progress').textContent=forms.filter(f=>f.review_status==='complete').length+'/'+forms.length+' 已完成';nav()}
function nav(){const box=$('nav');box.replaceChildren();CASES.forEach((c,i)=>{const b=el('button',(i+1)+' · '+c.target,(i===current?'active ':'')+(forms[i].review_status==='complete'?'done':''));b.onclick=()=>{current=i;render()};box.append(b)})}
function radio(name,value,checked,onchange,text){const label=el('label',undefined,'choice'),input=el('input');input.type='radio';input.name=name;input.value=value;input.checked=checked;input.onchange=onchange;label.append(input,el('span',text));return label}
function relationControl(answer,field){const box=el('div',undefined,'sub');box.append(el('div',field==='personal_stake'?'这笔钱属于谁？':'这笔钱属于哪次行为？','hint'));
const values=field==='personal_stake'?[['target','目标人'],['other','其他人'],['shared','多人共同'],['unclear','看不清']]:[['target_event','目标人本次行为'],['other_event','其他事件／既往行为'],['unclear','看不清']];
for(const [value,text] of values)box.append(radio(field+'-relation',value,answer.relation===value,()=>{answer.relation=value;save()},text));return box}
function renderViews(c,box){c.allowed_views.forEach(v=>{const d=el('div',undefined,'view');d.append(el('div',v.type+' · 原文位置 '+v.start+'–'+v.end,'label'));
const line=el('div',undefined,'views'),matches=c.amounts.filter(q=>v.start<=q.start&&q.end<=v.end).sort((a,b)=>a.start-b.start);let pos=v.start;
for(const q of matches){if(q.start<pos)continue;line.append(document.createTextNode(v.text.slice(pos-v.start,q.start-v.start)));const mark=el('mark',q.raw);mark.title=q.candidate_id+' · 原文位置 '+q.start+'–'+q.end;line.append(mark);pos=q.end}line.append(document.createTextNode(v.text.slice(pos-v.start)));d.append(line);box.append(d)})}
function renderField(c,f,field,title){const a=f.answers[field],box=el('section',undefined,'card');box.append(el('h2',title),el('p',BOUNDARIES[field],'hint'),el('p','按原文判断。黄色标记是程序发现的金额位置，可能漏掉或提错；同值重复时请看上下文。','hint'));
const options=[['absent','原文没有这个字段（即使出现其他金额）'],['unclear','原文有线索，但我无法确定'],['missed','正确金额未列在候选中']];
for(const [value,text] of options)box.append(radio(field+'-decision',value,a.decision===value,()=>{a.decision=value;a.candidate_id=null;a.relation=null;save();render()},text));
if(a.decision==='missed'){const sub=el('div',undefined,'sub');sub.append(el('label','复制原文中的那段金额文字（用于定位漏提候选）'));const input=el('textarea');input.value=a.missed_quote||'';input.onchange=()=>{a.missed_quote=input.value.trim();save()};sub.append(input);box.append(sub)}
for(const [i,q] of c.amounts.entries()){const chosen=a.decision==='candidate'&&a.candidate_id===q.candidate_id;const label=radio(field+'-decision',q.candidate_id,chosen,()=>{a.decision='candidate';a.candidate_id=q.candidate_id;a.relation=null;save();render()},'候选 '+(i+1)+'：'+q.raw+'  · 原文位置 '+q.start+'–'+q.end);box.append(label);if(chosen)box.append(relationControl(a,field))}
const sub=el('div',undefined,'sub');sub.append(el('label','补充说明（可选）'));const note=el('textarea');note.value=a.note||'';note.onchange=()=>{a.note=note.value;save()};sub.append(note);box.append(sub);return box}
function issues(c,f){const out=[];for(const [field] of FIELDS){const a=f.answers[field];if(!a||!a.decision)out.push(field+' 尚未选择');else if(a.decision==='candidate'&&(!c.amounts.some(q=>q.candidate_id===a.candidate_id)||!a.relation))out.push(field+' 尚未选择关系');else if(a.decision==='missed'&&!a.missed_quote.trim())out.push(field+' 尚未填写漏提原文')}return out}
function render(){nav();const c=CASES[current],f=forms[current],main=$('main');main.replaceChildren();$('message').textContent='';const top=el('section',undefined,'card');top.append(el('h1',(current+1)+'/6 · 目标人：'+c.target),el('p','别名：'+(c.aliases.join('、')||'无')+'。只根据下面的原文作答；系统答案和银标未显示。','hint'));main.append(top);
const source=el('section',undefined,'card');source.append(el('h2','原文'));renderViews(c,source);main.append(source);
for(const [field,title] of FIELDS)main.append(renderField(c,f,field,title));const bottom=el('section',undefined,'card row');const done=el('button','标为完成并下一案','primary');done.onclick=()=>{const errs=issues(c,f);if(errs.length){$('message').textContent=errs.join('；');return}f.review_status='complete';save();if(current<CASES.length-1)current++;render()};bottom.append(done);const pending=el('button','暂存，稍后继续');pending.onclick=()=>{f.review_status='pending';save();if(current<CASES.length-1)current++;render()};bottom.append(pending);main.append(bottom)}
$('reviewer').value=localStorage.getItem(KEY+'-reviewer')||'';$('reviewer').onchange=()=>localStorage.setItem(KEY+'-reviewer',$('reviewer').value.trim());
$('export').onclick=()=>{const payload={schema:'simple-amount-edge-review-v1',reviewer_id:$('reviewer').value.trim()||null,exported_at:new Date().toISOString(),cases:forms};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const a=el('a');a.href=URL.createObjectURL(blob);a.download='simple-amount-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.schema!=='simple-amount-edge-review-v1'||!Array.isArray(data.cases)||data.cases.length!==CASES.length||data.cases.some((f,i)=>f.id!==CASES[i].id||f.source_sha256!==CASES[i].source_sha256))throw Error('文件与本试标包不匹配');forms=data.cases;$('reviewer').value=data.reviewer_id||'';save();render();$('message').textContent='导入成功'}catch(err){$('message').textContent='导入失败：'+err.message}};
save();render();
</script></body></html>
