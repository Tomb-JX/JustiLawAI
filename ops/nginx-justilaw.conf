# JustiLawAI nginx 入口
# 公网：law.huanghaiyang.com（HTTP；HTTPS 证书就绪后追加 443 server 块）
# 回环：127.0.0.1:8101（SSH 隧道访问路径，替代原 serve.py）
# SSE 关键：proxy_buffering off + 长读超时，否则流式输出会被攒包

server {
    listen 80;
    server_name law.huanghaiyang.com;

    client_max_body_size 25m;

    location /api/ {
        limit_req zone=justilaw_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection '';
    }

    location / {
        root /opt/justilaw/web;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:8101;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection '';
    }

    location / {
        root /opt/justilaw/web;
        try_files $uri $uri/ /index.html;
    }
}
